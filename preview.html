<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile README — local preview</title>
<style>
  :root { --green: #39D353; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    background: #f6f8fa;
    color: #24292f;
    padding: 32px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #57606a; margin-top: 0; margin-bottom: 32px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
  .card {
    border: 1px solid #d0d7de;
    border-radius: 12px;
    padding: 16px;
    background: #fff;
  }
  .card.dark { background: #0d1117; border-color: #30363d; }
  .card h3 { margin: 0 0 12px; font-size: 13px; color: #57606a; }
  .card.dark h3 { color: #8b949e; }
  .card img { max-width: 100%; display: block; }
  .missing {
    width: 300px; height: 100px; display: flex; align-items: center; justify-content: center;
    color: #cf222e; font-size: 12px; border: 1px dashed #cf222e; border-radius: 8px;
  }
  .toggle {
    position: fixed; top: 24px; right: 32px;
    background: var(--green); color: #0d1117; border: none;
    padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  body.forced-dark { background: #0d1117; color: #c9d1d9; }
  body.forced-dark p.sub { color: #8b949e; }
</style>
</head>
<body>

<button class="toggle" onclick="document.body.classList.toggle('forced-dark')">toggle preview theme</button>

<h1>Local asset preview</h1>
<p class="sub">Every generated file, on both a dark card and a light card — exactly how GitHub will render them. Nothing here is pushed anywhere.</p>

<div id="app"></div>

<script>
const groups = [
  { title: "Portrait", files: ["assets/portrait.svg"] },
  { title: "Portrait (monochrome pair)", files: ["assets/portrait-mono-dark.svg", "assets/portrait-mono-light.svg"] },
  { title: "Skill radar", files: ["assets/radar-dark.svg", "assets/radar-light.svg"] },
  { title: "Language radar", files: ["assets/radar-langs-dark.svg", "assets/radar-langs-light.svg"] },
  { title: "Stat card", files: ["assets/stats-dark.svg", "assets/stats-light.svg"] },
  { title: "Project cards", files: [
      "assets/card-threadscope-live-dark.svg", "assets/card-threadscope-live-light.svg",
      "assets/card-connectsphere-dark.svg", "assets/card-connectsphere-light.svg",
      "assets/card-sentinel-x-dark.svg", "assets/card-sentinel-x-light.svg",
      "assets/card-samiip-dark.svg", "assets/card-samiip-light.svg"
  ]},
  { title: "Metrics (generated by the metrics workflow on GitHub)", files: ["assets/metrics.svg"] },
];

const app = document.getElementById("app");

groups.forEach(g => {
  const h2 = document.createElement("h2");
  h2.textContent = g.title;
  h2.style.fontSize = "15px";
  app.appendChild(h2);

  const row = document.createElement("div");
  row.className = "row";

  g.files.forEach(f => {
    const isDark = f.includes("-dark") || (!f.includes("-light") && f === "assets/portrait.svg" ? false : f.includes("-dark"));
    const card = document.createElement("div");
    card.className = "card" + (f.includes("-dark") ? " dark" : "");

    const label = document.createElement("h3");
    label.textContent = f;
    card.appendChild(label);

    const img = document.createElement("img");
    img.src = f;
    img.onerror = () => {
      card.innerHTML = "";
      const label2 = document.createElement("h3");
      label2.textContent = f;
      card.appendChild(label2);
      const missing = document.createElement("div");
      missing.className = "missing";
      missing.textContent = "not generated yet — run the matching script";
      card.appendChild(missing);
    };
    card.appendChild(img);
    row.appendChild(card);
  });

  app.appendChild(row);
});
</script>

</body>
</html>
